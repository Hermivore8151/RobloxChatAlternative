[project]
name = "roblox-chat-alternative"
version = "2.3.1"
description = "My attempt at replacing, the now heavily locked down chat system, with something more community driven"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.28.1",
    "keyboard>=0.13.5",
    "pyqt6>=6.5.0",
    "websockets>=17.0.1",
]

[project.scripts]
roblox-chat = "source:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["source.py"]
